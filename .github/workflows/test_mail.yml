name: Test Mail

on:
  workflow_dispatch:
  schedule:
    # 09:00 KST daily
    - cron: "7 0 * * *"

jobs:
  send-test-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install pandas openpyxl playwright

      - name: Install browser for report capture
        run: python -m playwright install --with-deps chromium

      - name: Create TV price report
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python create_tv_report.py

      - name: Capture report image
        run: python render_report_image.py

      - name: Send test mail
        env:
          GMAIL_ID: ${{ secrets.GMAIL_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python test_mail.py
